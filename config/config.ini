[turn]
# all lifetimes are in seconds
# allocation_lifetime = 600
# maximum_allocation_lifetime = 3600
# channel_lifetime = 600
# permission_lifetime = 300
# reservation_lifetime = 300
# relay ip will default to 127.0.0.1 if unset
# relay_ip = 127.0.0.1
# Relay port range for TURN allocations (RFC 5766, Section 6.2).
# IANA dynamic/private port range: 49152–65535.
#
# NOTE (Linux deployments): The default Linux ephemeral port range (32768–60999)
# overlaps with this range at 49152–60999. To avoid bind collisions, restrict
# the OS ephemeral range before starting the server:
#
#   echo "32768 49151" > /proc/sys/net/ipv4/ip_local_port_range
#
# This is not required on Windows or macOS, which use 49152–65535 for
# ephemeral ports and do not overlap with this range.
#
# For EvenAndReserveNext policy (RTP/RTCP pairs), this range provides
# 8192 usable pairs.
#relay_port_min = 49152
#relay_port_max = 65535

